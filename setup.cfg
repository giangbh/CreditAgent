[metadata]
name = credit-agent-poc
version = 0.1.0
description = Runnable multi-agent credit co-approval proof of concept
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
credit_agent_poc =
    static/*.html
    config/*.json

[options.entry_points]
console_scripts =
    credit-agent-poc = credit_agent_poc.cli:main
